<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Jev Trade</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #fff;
      --ink: #000;
      --ink-2: #333;
      --muted: #666;
      --line: #000;
      --grid: #e5e5e5;
      --buy: #00aa00;
      --sell: #cc0000;
      --panel: #f8f9fa;
      --hold: #f1f3f4;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--ink); }
    body {
      font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace;
      font-size: 13px;
      letter-spacing: -0.02em;
      min-height: 100dvh;
    }
    button { font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--line); }
    .head, .sleeves, .chart, .split, .book { border-bottom: 1px solid var(--line); }
    .head {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      flex-wrap: wrap;
    }
    .brand { font-weight: 700; font-size: 14px; }
    .tag { color: var(--muted); font-size: 12px; }
    .live { display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: 12px; margin-left: auto; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--buy); }
    .scores { display: flex; gap: 14px; width: 100%; justify-content: space-between; }
    .score { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .score b { font-size: 10px; letter-spacing: 0.08em; color: var(--muted); font-weight: 700; }
    .score span { font-weight: 700; font-size: 15px; font-variant-numeric: tabular-nums; }
    .pos { color: var(--buy); }
    .neg { color: var(--sell); }
    .sleeves { display: flex; overflow-x: auto; }
    .sleeve {
      flex: 1 0 108px;
      text-align: left;
      padding: 10px 12px;
      border: 0;
      border-right: 1px solid var(--line);
      border-radius: 0;
    }
    .sleeve.on { background: var(--panel); box-shadow: inset 0 3px 0 var(--ink); }
    .sleeve .n { font-weight: 700; }
    .sleeve .p { font-weight: 700; font-variant-numeric: tabular-nums; margin-top: 4px; }
    .sleeve .m { color: var(--muted); font-size: 11px; margin-top: 2px; }
    .chart { position: relative; height: 320px; }
    canvas { width: 100%; height: 100%; display: block; }
    .px {
      position: absolute;
      left: 12px;
      top: 10px;
      font-weight: 700;
      font-size: 22px;
      font-variant-numeric: tabular-nums;
    }
    .sub { font-size: 12px; color: var(--muted); font-weight: 500; }
    .word {
      position: absolute;
      right: 12px;
      top: 10px;
      font-weight: 700;
      letter-spacing: 0.04em;
    }
    .tools { display: flex; gap: 6px; padding: 8px 12px; border-top: 1px solid var(--grid); }
    .tools button { padding: 4px 8px; font-size: 12px; font-weight: 700; }
    .tools button.on { background: var(--ink); color: var(--bg); }
    .split { display: grid; grid-template-columns: 1fr; }
    .call { padding: 12px 14px; border-bottom: 1px solid var(--line); }
    .call h2, .book h2 {
      margin: 0 0 8px;
      background: var(--ink);
      color: var(--bg);
      display: inline-block;
      padding: 2px 8px;
      font-size: 12px;
      letter-spacing: 0.08em;
    }
    .kv { display: grid; grid-template-columns: 88px 1fr; gap: 4px 8px; }
    .kv b { color: var(--muted); font-weight: 500; }
    .book { padding: 0 0 24px; }
    .tabs { display: flex; }
    .tabs button { border: 0; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 8px 14px; font-weight: 700; }
    .tabs button.on { background: var(--ink); color: var(--bg); }
    table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
    th { font-size: 11px; color: var(--muted); font-weight: 700; }
    .long { color: var(--buy); font-weight: 700; }
    .short { color: var(--sell); font-weight: 700; }
    @media (min-width: 900px) {
      .scores { width: auto; margin-left: auto; }
      .live { margin-left: 0; }
      .chart { height: 460px; }
      .split { grid-template-columns: 280px 1fr; }
      .call { border-bottom: 0; border-right: 1px solid var(--line); }
    }
  </style>
</head>
<body>
  <header class="head">
    <div class="brand">Jev Trade</div>
    <div class="tag">Dry run · paper</div>
    <div class="live"><span class="dot"></span> Live</div>
    <div class="scores">
      <div class="score"><b>BTCUSDT</b><span id="btc">—</span></div>
      <div class="score"><b>UNREALIZED</b><span id="u">—</span></div>
      <div class="score"><b>REALIZED</b><span id="r">—</span></div>
    </div>
  </header>
  <nav class="sleeves" id="sleeves"></nav>
  <section class="chart">
    <canvas id="c"></canvas>
    <div class="px"><div id="last">—</div><div class="sub" id="pair">BTCUSDT · 15m</div></div>
    <div class="word" id="word">HOLD</div>
    <div class="tools" id="iv"></div>
  </section>
  <section class="split">
    <div class="call">
      <h2>CALL</h2>
      <div class="kv" id="call"></div>
    </div>
    <div class="book">
      <div class="tabs">
        <button class="on" id="tabP" type="button">Positions</button>
        <button id="tabH" type="button">History</button>
      </div>
      <div id="tbl"></div>
    </div>
  </section>
  <script>
    const BOOK = {
      BTC: { sz: 0.00051, entry: 77475, lev: 3, realized: -2.94342, closes: [
        { ts: 1793456912146, side: "sell", price: 75504, size: 0.0005, pnl: -1.9185 },
        { ts: 1793457269606, side: "buy", price: 77514, size: 0.00052, pnl: -1.02492 }
      ]},
      ETH: { sz: 0.0054, entry: 2240.3, lev: 3, realized: 0, closes: [] },
      SOL: { sz: 0.37, entry: 105.24, lev: 3, realized: 0, closes: [] },
      DOGE: { sz: 159, entry: 0.075185, lev: 3, realized: -0.1519, closes: [
        { ts: 1793450700326, side: "buy", price: 0.075335, size: 533, pnl: -0.1519 }
      ]},
      BNB: { sz: -0.056, entry: 711.24, lev: 3, realized: 0.0972, closes: [
        { ts: 1793525888674, side: "sell", price: 710.91, size: 0.02, pnl: 0.0972 }
      ]}
    };
    const COINS = ["BTC", "ETH", "SOL", "DOGE", "BNB"];
    const IV = ["1m", "5m", "15m", "30m", "1h"];
    let coin = "BTC";
    let iv = "15m";
    let mids = {};
    let candles = [];
    let tab = "pos";

    const $ = (id) => document.getElementById(id);
    const fmt = (n, d) => Number(n).toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d });
    const px = (n) => n >= 1000 ? fmt(n, 1) : n >= 1 ? fmt(n, 2) : fmt(n, 5);
    const usd = (n) => (n < 0 ? "-$" : "$") + Math.abs(n).toFixed(2);
    const sideOf = (sz) => sz > 0 ? "LONG" : sz < 0 ? "SHORT" : "FLAT";
    const upnl = (c, mark) => (mark - c.entry) * c.sz;

    function paintSleeves() {
      $("sleeves").innerHTML = COINS.map((c) => {
        const mark = mids[c];
        const b = BOOK[c];
        const u = mark ? upnl(b, mark) : 0;
        return `<button class="sleeve${c === coin ? " on" : ""}" data-c="${c}" type="button">
          <div class="n">${c}</div>
          <div class="p">${mark ? px(mark) : "—"}</div>
          <div class="m ${u < 0 ? "neg" : "pos"}">${sideOf(b.sz)} ${b.lev}x</div>
        </button>`;
      }).join("");
      document.querySelectorAll(".sleeve").forEach((el) => el.onclick = () => { coin = el.dataset.c; load(); });
    }

    function paintScores() {
      const btc = mids.BTC;
      $("btc").textContent = btc ? px(btc) : "—";
      let u = 0, r = 0;
      for (const c of COINS) {
        r += BOOK[c].realized;
        if (mids[c]) u += upnl(BOOK[c], mids[c]);
      }
      const us = $("u"), rs = $("r");
      us.textContent = usd(u); us.className = u < 0 ? "neg" : "pos";
      rs.textContent = usd(r); rs.className = r < 0 ? "neg" : "pos";
    }

    function paintCall() {
      const b = BOOK[coin];
      const mark = mids[coin];
      const word = sideOf(b.sz) === "SHORT" ? "SHORT" : sideOf(b.sz) === "LONG" ? "LONG" : "FLAT";
      $("word").textContent = word;
      $("word").style.color = word === "SHORT" ? "var(--sell)" : word === "LONG" ? "var(--buy)" : "var(--ink)";
      $("last").textContent = mark ? px(mark) : "—";
      $("pair").textContent = coin + "USDT · " + iv;
      const u = mark ? upnl(b, mark) : 0;
      $("call").innerHTML = [
        ["Market", coin + "USDT"],
        ["Side", sideOf(b.sz)],
        ["Size", String(Math.abs(b.sz))],
        ["Entry", px(b.entry)],
        ["Mark", mark ? px(mark) : "—"],
        ["Unrealized", usd(u)],
        ["Leverage", b.lev + "x"]
      ].map(([k, v]) => `<b>${k}</b><span>${v}</span>`).join("");
    }

    function paintBook() {
      if (tab === "pos") {
        $("tbl").innerHTML = `<table><thead><tr><th>Market</th><th>Side</th><th>Size</th><th>Entry</th><th>Mark</th><th>Unrealized</th><th>Lev</th></tr></thead><tbody>${
          COINS.map((c) => {
            const b = BOOK[c];
            const mark = mids[c];
            const u = mark ? upnl(b, mark) : 0;
            const s = sideOf(b.sz);
            return `<tr><td>${c}</td><td class="${s === "SHORT" ? "short" : "long"}">${s}</td><td>${Math.abs(b.sz)}</td><td>${px(b.entry)}</td><td>${mark ? px(mark) : "—"}</td><td class="${u < 0 ? "neg" : "pos"}">${usd(u)}</td><td>${b.lev}x</td></tr>`;
          }).join("")
        }</tbody></table>`;
        return;
      }
      const rows = COINS.flatMap((c) => BOOK[c].closes.map((f) => ({ c, ...f })))
        .sort((a, b) => b.ts - a.ts);
      $("tbl").innerHTML = `<table><thead><tr><th>Market</th><th>Side</th><th>Size</th><th>Price</th><th>Closed</th></tr></thead><tbody>${
        rows.map((f) => `<tr><td>${f.c}</td><td>${f.side}</td><td>${f.size}</td><td>${px(f.price)}</td><td class="${f.pnl < 0 ? "neg" : "pos"}">${usd(f.pnl)}</td></tr>`).join("") || `<tr><td colspan="5">No closed lots</td></tr>`
      }</tbody></table>`;
    }

    function draw() {
      const canvas = $("c");
      const dpr = window.devicePixelRatio || 1;
      const w = canvas.clientWidth, h = canvas.clientHeight;
      canvas.width = w * dpr; canvas.height = h * dpr;
      const g = canvas.getContext("2d");
      g.setTransform(dpr, 0, 0, dpr, 0, 0);
      g.clearRect(0, 0, w, h);
      g.strokeStyle = "#e5e5e5";
      for (let i = 1; i < 4; i++) {
        g.beginPath(); g.moveTo(0, h * i / 4); g.lineTo(w, h * i / 4); g.stroke();
      }
      if (!candles.length) return;
      const hi = Math.max(...candles.map((k) => k[2]));
      const lo = Math.min(...candles.map((k) => k[3]));
      const pad = (hi - lo) * 0.08 || 1;
      const top = hi + pad, bot = lo - pad;
      const n = candles.length;
      const cw = w / n;
      const y = (p) => (top - p) / (top - bot) * (h - 16) + 8;
      candles.forEach((k, i) => {
        const up = k[4] >= k[1];
        const x = i * cw + cw / 2;
        g.strokeStyle = up ? "#00aa00" : "#cc0000";
        g.fillStyle = g.strokeStyle;
        g.beginPath(); g.moveTo(x, y(k[2])); g.lineTo(x, y(k[3])); g.stroke();
        const bh = Math.max(1, Math.abs(y(k[1]) - y(k[4])));
        g.fillRect(x - Math.max(1, cw * 0.3), Math.min(y(k[1]), y(k[4])), Math.max(2, cw * 0.6), bh);
      });
    }

    async function loadMids() {
      const q = await fetch("https://data-api.binance.vision/api/v3/ticker/price?symbols=" + encodeURIComponent(JSON.stringify(COINS.map((c) => c + "USDT"))));
      const rows = await q.json();
      for (const row of rows) mids[row.symbol.replace("USDT", "")] = Number(row.price);
      paintSleeves(); paintScores(); paintCall(); paintBook();
    }

    async function loadCandles() {
      const q = await fetch(`https://data-api.binance.vision/api/v3/klines?symbol=${coin}USDT&interval=${iv}&limit=96`);
      candles = (await q.json()).map((k) => [Number(k[0]), Number(k[1]), Number(k[2]), Number(k[3]), Number(k[4])]);
      draw();
    }

    function load() {
      paintSleeves(); paintCall();
      loadCandles().catch(() => {});
    }

    $("iv").innerHTML = IV.map((x) => `<button type="button" data-i="${x}" class="${x === iv ? "on" : ""}">${x}</button>`).join("");
    $("iv").onclick = (e) => {
      const b = e.target.closest("button");
      if (!b) return;
      iv = b.dataset.i;
      $("iv").querySelectorAll("button").forEach((el) => el.classList.toggle("on", el.dataset.i === iv));
      load();
    };
    $("tabP").onclick = () => { tab = "pos"; $("tabP").classList.add("on"); $("tabH").classList.remove("on"); paintBook(); };
    $("tabH").onclick = () => { tab = "hist"; $("tabH").classList.add("on"); $("tabP").classList.remove("on"); paintBook(); };
    addEventListener("resize", draw);
    loadMids().then(loadCandles).catch(() => {});
    setInterval(() => loadMids().catch(() => {}), 5000);
    setInterval(() => loadCandles().catch(() => {}), 20000);
  </script>
</body>
</html>
